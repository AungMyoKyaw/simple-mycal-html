<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myanmar Calendar</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#000000" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="Myanmar Calendar" />
    <meta property="og:description" content="Traditional Myanmar Calendar" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calendar" />

    <style>
      /* Design System */

      :root {
        --color-bg: #ffffff;
        --color-bg-secondary: #f5f5f7;
        --color-text: #1d1d1f;
        --color-text-secondary: #86868b;
        --color-border: #d2d2d7;
        --color-border-light: #e5e5ea;
        --color-accent: #007aff;
        --radius: 8px;
        --radius-lg: 12px;
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
        --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 2.5rem 1rem;
        animation: fadeIn 0.5s var(--ease);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Typography */

      h1 {
        font-size: 1.875rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        text-align: center;
        margin-bottom: 2.5rem;
        color: var(--color-text);
      }

      /* Header */

      header {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 2rem;
      }

      .nav-group {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      .btn-icon {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        color: var(--color-text);
        transition:
          transform 0.15s var(--ease),
          background 0.15s var(--ease);
      }

      .btn-icon:hover {
        background: var(--color-bg-secondary);
      }

      .btn-icon:active {
        transform: scale(0.92);
      }

      .btn-icon svg {
        width: 17px;
        height: 17px;
      }

      .picker-button {
        padding: 0.5rem 0.75rem;
        background: var(--color-bg-secondary);
        border: none;
        border-radius: var(--radius);
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--color-text);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition:
          background 0.15s var(--ease),
          transform 0.15s var(--ease);
        min-width: 95px;
        justify-content: space-between;
      }

      .picker-button:hover {
        background: var(--color-border-light);
      }

      .picker-button:active {
        transform: scale(0.97);
      }

      .picker-button svg {
        width: 11px;
        height: 11px;
        opacity: 0.4;
      }

      /* Actions */

      .actions {
        display: flex;
        justify-content: center;
        gap: 0.375rem;
        margin-bottom: 2rem;
      }

      /* Weekday Names */

      #weekdayNames {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .weekday-name {
        text-align: center;
        font-size: 0.65rem;
        font-weight: 500;
        color: var(--color-text-secondary);
        opacity: 0.6;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        padding: 0.5rem;
      }

      /* Calendar Grid */

      #calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }

      .calendar-cell {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0.5rem;
        background: var(--color-bg-secondary);
        border-radius: var(--radius);
        cursor: pointer;
        transition:
          transform 0.2s var(--spring),
          background 0.15s var(--ease);
        position: relative;
      }

      .calendar-cell:hover {
        transform: scale(1.03);
        background: var(--color-border-light);
      }

      .calendar-cell:active {
        transform: scale(0.98);
        opacity: 0.8;
      }

      .calendar-cell.today {
        position: relative;
      }

      .calendar-cell.today::before {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: calc(var(--radius) + 2px);
        border: 2px solid var(--color-accent);
        opacity: 0.4;
      }

      .calendar-cell.today .day-number {
        color: var(--color-accent);
      }

      .day-number {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--color-text);
        margin-bottom: 0.25rem;
        letter-spacing: -0.02em;
      }

      .myanmar-date {
        font-size: 0.6rem;
        color: var(--color-text-secondary);
        text-align: center;
        line-height: 1.2;
        opacity: 0.7;
      }

      /* Dropdown */

      .dropdown-menu {
        position: absolute;
        top: 100%;
        left: 0;
        margin-top: 0.375rem;
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        z-index: 100;
        min-width: 140px;
        max-height: 260px;
        overflow-y: auto;
        animation: dropdownIn 0.2s var(--spring);
      }

      @keyframes dropdownIn {
        from {
          opacity: 0;
          transform: translateY(-4px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .dropdown-menu input {
        width: 100%;
        padding: 0.625rem 0.75rem;
        border: none;
        border-bottom: 1px solid var(--color-border-light);
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        font-size: 0.8125rem;
        background: var(--color-bg);
        outline: none;
      }

      .dropdown-menu ul {
        list-style: none;
      }

      .dropdown-item {
        padding: 0.5625rem 0.75rem;
        font-size: 0.8125rem;
        cursor: pointer;
        transition: background 0.15s var(--ease);
      }

      .dropdown-item:hover {
        background: var(--color-bg-secondary);
      }

      .dropdown-item.selected {
        background: var(--color-accent);
        color: white;
      }

      /* Modal */

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 1rem;
        animation: fadeIn 0.2s var(--ease);
      }

      .modal-content {
        background: var(--color-bg);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        max-width: 360px;
        width: 100%;
        box-shadow: var(--shadow-lg);
        animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
      }

      .modal-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-bg-secondary);
        border: none;
        border-radius: 50%;
        cursor: pointer;
        color: var(--color-text-secondary);
        transition: all 0.2s var(--ease);
      }

      .modal-close:hover {
        background: var(--color-border-light);
        color: var(--color-text);
      }

      .modal-close:active {
        transform: scale(0.9);
      }

      .modal-close svg {
        width: 14px;
        height: 14px;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .modal-title {
        font-size: 1.125rem;
        font-weight: 600;
        text-align: center;
        margin-bottom: 1.25rem;
        color: var(--color-text);
        letter-spacing: -0.02em;
        padding-right: 2rem;
      }

      .modal-detail {
        padding: 0.625rem 0;
        border-bottom: 1px solid var(--color-border-light);
        font-size: 0.9375rem;
        color: var(--color-text);
        text-align: center;
        line-height: 1.5;
      }

      .modal-detail:last-child {
        border-bottom: none;
      }

      .modal-buttons {
        display: flex;
        gap: 0.625rem;
        margin-top: 1.25rem;
      }

      .modal-buttons button {
        flex: 1;
        padding: 0.625rem;
        font-size: 0.875rem;
        transition: transform 0.15s var(--ease);
      }

      .modal-buttons button:active {
        transform: scale(0.97);
      }

      /* Toast */

      .toast {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--color-text);
        color: white;
        padding: 0.625rem 1.125rem;
        border-radius: var(--radius-lg);
        font-size: 0.8125rem;
        box-shadow: var(--shadow-md);
        opacity: 0;
        transition: all 0.35s var(--spring);
        z-index: 2000;
      }

      .toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Input */

      input[type="date"],
      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 0.625rem 0.75rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        font-size: 0.9375rem;
        background: var(--color-bg);
        outline: none;
        transition: border-color 0.15s var(--ease);
      }

      input:focus {
        border-color: var(--color-accent);
      }

      /* Buttons */

      .btn-primary {
        padding: 0.625rem 1rem;
        background: var(--color-accent);
        color: white;
        border: none;
        border-radius: var(--radius);
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition:
          transform 0.15s var(--ease),
          opacity 0.15s var(--ease);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-primary:hover {
        opacity: 0.9;
      }

      .btn-primary:active {
        transform: scale(0.97);
      }

      .btn-primary svg {
        width: 15px;
        height: 15px;
      }

      /* Hidden */

      .hidden {
        display: none !important;
      }

      /* Responsive - Tablet */
      @media (max-width: 1024px) {
        main {
          max-width: 720px;
          padding: 2rem 1rem;
        }

        .calendar-cell {
          padding: 0.45rem;
        }

        .dropdown-menu {
          max-height: 240px;
        }
      }

      /* Responsive - Small Tablet */
      @media (max-width: 768px) {
        main {
          max-width: 600px;
          padding: 1.75rem 1rem;
        }

        h1 {
          font-size: 1.625rem;
          margin-bottom: 2rem;
        }

        .weekday-name {
          font-size: 0.6rem;
          padding: 0.4rem;
        }

        .calendar-cell {
          padding: 0.4rem;
        }

        .day-number {
          font-size: 1.05rem;
        }

        .myanmar-date {
          font-size: 0.6rem;
        }

        .modal-content {
          max-width: 400px;
          padding: 1.375rem;
        }

        .modal-title {
          font-size: 1.0625rem;
        }

        .modal-detail {
          font-size: 0.9rem;
        }

        .btn-icon {
          width: 36px;
          height: 36px;
        }

        .btn-icon svg {
          width: 18px;
          height: 18px;
        }

        .picker-button {
          padding: 0.5625rem 0.8125rem;
          font-size: 0.84375rem;
          min-width: 100px;
        }
      }

      /* Responsive - Mobile */
      @media (max-width: 640px) {
        main {
          padding: 1.5rem 0.75rem;
        }

        h1 {
          font-size: 1.5rem;
          margin-bottom: 1.75rem;
        }

        header {
          margin-bottom: 1.75rem;
        }

        .nav-group {
          gap: 0.25rem;
        }

        .btn-icon {
          width: 34px;
          height: 34px;
        }

        .btn-icon svg {
          width: 16px;
          height: 16px;
        }

        .picker-button {
          padding: 0.5rem 0.6875rem;
          font-size: 0.78125rem;
          min-width: 90px;
          gap: 0.4375rem;
        }

        .picker-button svg {
          width: 10px;
          height: 10px;
        }

        .actions {
          gap: 0.3125rem;
        }

        #calendar {
          gap: 0.375rem;
          margin-bottom: 1.25rem;
        }

        .weekday-name {
          font-size: 0.575rem;
          padding: 0.375rem 0.25rem;
        }

        .day-number {
          font-size: 1.1rem;
        }

        .myanmar-date {
          font-size: 0.5625rem;
          line-height: 1.25;
        }

        .calendar-cell {
          padding: 0.35rem 0.3125rem;
          border-radius: 6px;
        }

        .calendar-cell.today::before {
          inset: -2px;
          border-width: 1.5px;
        }

        .modal-content {
          max-width: calc(100vw - 2rem);
          padding: 1.25rem 1.125rem;
          margin: 0.5rem;
        }

        .modal-title {
          font-size: 1rem;
          margin-bottom: 1rem;
        }

        .modal-detail {
          font-size: 0.875rem;
          padding: 0.5625rem 0;
        }

        .modal-buttons {
          flex-direction: column;
          gap: 0.5rem;
        }

        .modal-buttons button {
          padding: 0.6875rem;
        }

        .dropdown-menu {
          min-width: 130px;
          max-height: 220px;
        }

        .dropdown-menu input,
        .dropdown-item {
          font-size: 0.78125rem;
          padding: 0.53125rem 0.6875rem;
        }
      }

      /* Responsive - Small Mobile */
      @media (max-width: 375px) {
        main {
          padding: 1.25rem 0.5rem;
        }

        h1 {
          font-size: 1.375rem;
          margin-bottom: 1.5rem;
        }

        .btn-icon {
          width: 32px;
          height: 32px;
        }

        .btn-icon svg {
          width: 15px;
          height: 15px;
        }

        .picker-button {
          padding: 0.4375rem 0.625rem;
          font-size: 0.75rem;
          min-width: 80px;
        }

        .weekday-name {
          font-size: 0.525rem;
          padding: 0.3125rem 0.125rem;
        }

        #calendar,
        #weekdayNames {
          gap: 0.3125rem;
        }

        .day-number {
          font-size: 0.9375rem;
        }

        .myanmar-date {
          font-size: 0.53125rem;
        }

        .calendar-cell {
          padding: 0.3125rem 0.25rem;
          border-radius: 5px;
        }

        .calendar-cell.today::after {
          bottom: 5px;
          width: 3px;
          height: 3px;
        }

        .modal-content {
          padding: 1.125rem 1rem;
        }

        .modal-title {
          font-size: 0.9375rem;
        }

        .modal-detail {
          font-size: 0.8125rem;
          padding: 0.5rem 0;
        }

        .dropdown-menu {
          min-width: 120px;
          max-height: 200px;
        }
      }

      /* Responsive - Landscape Mobile */
      @media (max-height: 500px) and (orientation: landscape) {
        main {
          padding: 1rem 0.75rem;
        }

        h1 {
          font-size: 1.25rem;
          margin-bottom: 1rem;
        }

        header {
          margin-bottom: 1rem;
        }

        .modal-content {
          max-height: 80vh;
          overflow-y: auto;
        }

        .dropdown-menu {
          max-height: 180px;
        }
      }

      /* Print */

      @media print {
        .btn-icon,
        .picker-button,
        .actions,
        .modal-overlay {
          display: none !important;
        }

        body {
          background: white;
        }

        main {
          max-width: 100%;
          padding: 1rem;
        }

        .calendar-cell {
          border: 1px solid var(--color-border);
        }
      }

      /* Scrollbar */

      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--color-border);
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-text-secondary);
      }

      /* Loading State */

      .loading-overlay {
        position: fixed;
        inset: 0;
        background: var(--color-bg);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition:
          opacity 0.4s var(--ease),
          visibility 0.4s;
      }

      .loading-overlay.hidden {
        opacity: 0;
        visibility: hidden;
      }

      body.loading main {
        opacity: 0;
      }

      body.loaded main {
        opacity: 1;
        transition: opacity 0.4s var(--ease);
      }

      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 2.5px solid var(--color-border-light);
        border-top-color: var(--color-accent);
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .loading-text {
        margin-top: 1rem;
        font-size: 0.875rem;
        color: var(--color-text-secondary);
        opacity: 0;
        animation: fadeIn 0.4s var(--ease) 0.2s forwards;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="loading">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div class="loading-text">Myanmar Calendar</div>
    </div>

    <main>
      <header>
        <div class="nav-group">
          <button id="prevMonth" class="btn-icon" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>

          <div style="position: relative">
            <button id="monthPicker" class="picker-button">
              <span id="selectedMonth">Select Month</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div id="monthDropdown" class="dropdown-menu hidden">
              <input type="text" id="monthSearch" placeholder="Search..." />
              <ul id="monthList"></ul>
            </div>
          </div>

          <div style="position: relative">
            <button id="yearPicker" class="picker-button">
              <span id="selectedYear">Select Year</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div id="yearDropdown" class="dropdown-menu hidden">
              <input type="number" id="yearSearch" placeholder="Search..." />
              <ul id="yearList"></ul>
            </div>
          </div>

          <button id="nextMonth" class="btn-icon" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M9 18l6-6-6-6" />
            </svg>
          </button>
        </div>
      </header>

      <h1 id="calendarTitle"></h1>

      <div class="actions">
        <button id="jumpToDate" class="btn-icon" title="Jump to date">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
        </button>
        <button id="shareDate" class="btn-icon" title="Share">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
          </svg>
        </button>
        <button id="exportMonth" class="btn-icon" title="Export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
        </button>
      </div>

      <div id="weekdayNames"></div>
      <section id="calendar"></section>
    </main>

    <!-- Date Modal -->
    <div id="myModal" class="modal-overlay hidden">
      <div class="modal-content">
        <button class="modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
        <h2 class="modal-title" id="modalDate"></h2>
        <div id="modalMyanmarDate"></div>
        <div class="modal-buttons">
          <button id="exportDateImage" class="btn-primary">Export</button>
        </div>
      </div>
    </div>

    <!-- Month Picker Modal -->
    <div id="monthPickerModal" class="modal-overlay hidden">
      <div class="modal-content">
        <button class="modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
        <h2 class="modal-title">Select Month</h2>
        <input type="text" id="monthSearchModal" placeholder="Search..." style="margin-bottom: 1rem" />
        <ul id="monthListModal" style="max-height: 260px; overflow-y: auto; margin-bottom: 1rem"></ul>
      </div>
    </div>

    <!-- Year Picker Modal -->
    <div id="yearPickerModal" class="modal-overlay hidden">
      <div class="modal-content">
        <button class="modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
        <h2 class="modal-title">Select Year</h2>
        <input type="number" id="yearSearchModal" placeholder="Search..." style="margin-bottom: 1rem" />
        <ul id="yearListModal" style="max-height: 260px; overflow-y: auto; margin-bottom: 1rem"></ul>
      </div>
    </div>

    <!-- Jump to Date Modal -->
    <div id="jumpToDateModal" class="modal-overlay hidden">
      <div class="modal-content">
        <button class="modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
        <h2 class="modal-title">Jump to Date</h2>
        <input type="date" id="jumpDateInput" style="margin-bottom: 1rem" />
        <div class="modal-buttons">
          <button id="confirmJumpDate" class="btn-primary">Jump</button>
        </div>
      </div>
    </div>

    <!-- Share Modal -->
    <div id="shareModal" class="modal-overlay hidden">
      <div class="modal-content">
        <button class="modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
        <h2 class="modal-title">Share Calendar</h2>
        <input type="text" id="shareLink" readonly style="margin-bottom: 1.5rem; font-size: 0.875rem; padding: 0.75rem 0.875rem; text-align: center; font-family: monospace" />
        <div class="modal-buttons">
          <button id="copyLink" class="btn-primary">Copy Link</button>
          <button id="shareNative" class="btn-primary">Share</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module">
      import { Mycal } from "https://unpkg.com/mycal@latest/dist/browser/index.js";

      document.addEventListener("DOMContentLoaded", () => {
        const calendarElement = document.getElementById("calendar");
        const calendarTitle = document.getElementById("calendarTitle");
        const prevMonthButton = document.getElementById("prevMonth");
        const nextMonthButton = document.getElementById("nextMonth");
        const monthPicker = document.getElementById("monthPicker");
        const yearPicker = document.getElementById("yearPicker");
        const myModal = document.getElementById("myModal");
        const modalDate = document.getElementById("modalDate");
        const modalMyanmarDate = document.getElementById("modalMyanmarDate");
        const weekdayNamesElement = document.getElementById("weekdayNames");

        const monthDropdown = document.getElementById("monthDropdown");
        const monthList = document.getElementById("monthList");
        const monthSearch = document.getElementById("monthSearch");
        const selectedMonthElement = document.getElementById("selectedMonth");
        const yearDropdown = document.getElementById("yearDropdown");
        const yearList = document.getElementById("yearList");
        const yearSearch = document.getElementById("yearSearch");
        const selectedYearElement = document.getElementById("selectedYear");

        const monthPickerModal = document.getElementById("monthPickerModal");
        const monthListModal = document.getElementById("monthListModal");
        const monthSearchModal = document.getElementById("monthSearchModal");
        const yearPickerModal = document.getElementById("yearPickerModal");
        const yearListModal = document.getElementById("yearListModal");
        const yearSearchModal = document.getElementById("yearSearchModal");

        let today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth();
        let isMobile = window.innerWidth <= 640;

        window.addEventListener("resize", () => {
          isMobile = window.innerWidth <= 640;
        });

        selectedMonthElement.textContent = getMonthName(currentMonth);
        selectedYearElement.textContent = currentYear;

        function populateMonthDropdown() {
          const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
          monthList.innerHTML = months.map((m, i) => `<li class="dropdown-item ${i === currentMonth ? "selected" : ""}" data-month="${i}">${m}</li>`).join("");
        }

        function populateYearDropdown() {
          const minYear = 1885;
          const maxYear = today.getFullYear() + 100;
          let html = "";
          for (let y = maxYear; y >= minYear; y--) {
            html += `<li class="dropdown-item ${y === currentYear ? "selected" : ""}" data-year="${y}">${y}</li>`;
          }
          yearList.innerHTML = html;
        }

        populateMonthDropdown();
        populateYearDropdown();

        monthPicker.addEventListener("click", (e) => {
          e.stopPropagation();
          if (isMobile) {
            showMonthModal();
          } else {
            monthDropdown.classList.toggle("hidden");
            yearDropdown.classList.add("hidden");
            monthSearch.value = "";
            filterMonthOptions();
          }
        });

        yearPicker.addEventListener("click", (e) => {
          e.stopPropagation();
          if (isMobile) {
            showYearModal();
          } else {
            yearDropdown.classList.toggle("hidden");
            monthDropdown.classList.add("hidden");
            yearSearch.value = "";
            filterYearOptions();
          }
        });

        document.addEventListener("click", () => {
          monthDropdown.classList.add("hidden");
          yearDropdown.classList.add("hidden");
        });

        monthList.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-month]");
          if (li) {
            currentMonth = parseInt(li.dataset.month);
            selectedMonthElement.textContent = li.textContent.trim();
            monthDropdown.classList.add("hidden");
            renderCalendar(currentYear, currentMonth);
          }
        });

        yearList.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-year]");
          if (li) {
            currentYear = parseInt(li.dataset.year);
            selectedYearElement.textContent = li.textContent.trim();
            yearDropdown.classList.add("hidden");
            renderCalendar(currentYear, currentMonth);
          }
        });

        monthDropdown.addEventListener("click", (e) => e.stopPropagation());
        yearDropdown.addEventListener("click", (e) => e.stopPropagation());

        function filterMonthOptions() {
          const filter = monthSearch.value.toLowerCase();
          monthList.querySelectorAll("li").forEach((opt) => {
            opt.style.display = opt.textContent.toLowerCase().includes(filter) ? "" : "none";
          });
        }

        function filterYearOptions() {
          const filter = yearSearch.value;
          yearList.querySelectorAll("li").forEach((opt) => {
            opt.style.display = opt.textContent.includes(filter) ? "" : "none";
          });
        }

        monthSearch.addEventListener("keyup", filterMonthOptions);
        yearSearch.addEventListener("keyup", filterYearOptions);

        function showMonthModal() {
          monthListModal.innerHTML = monthList.innerHTML;
          monthSearchModal.value = "";
          filterMonthOptionsModal();
          monthPickerModal.classList.remove("hidden");
        }

        function showYearModal() {
          yearListModal.innerHTML = yearList.innerHTML;
          yearSearchModal.value = "";
          filterYearOptionsModal();
          yearPickerModal.classList.remove("hidden");
        }

        function filterMonthOptionsModal() {
          const filter = monthSearchModal.value.toLowerCase();
          monthListModal.querySelectorAll("li").forEach((opt) => {
            opt.style.display = opt.textContent.toLowerCase().includes(filter) ? "" : "none";
          });
        }

        function filterYearOptionsModal() {
          const filter = yearSearchModal.value;
          yearListModal.querySelectorAll("li").forEach((opt) => {
            opt.style.display = opt.textContent.includes(filter) ? "" : "none";
          });
        }

        monthPickerModal.addEventListener("click", (e) => {
          if (e.target === monthPickerModal) monthPickerModal.classList.add("hidden");
        });

        yearPickerModal.addEventListener("click", (e) => {
          if (e.target === yearPickerModal) yearPickerModal.classList.add("hidden");
        });

        monthSearchModal.addEventListener("keyup", filterMonthOptionsModal);
        yearSearchModal.addEventListener("keyup", filterYearOptionsModal);

        monthListModal.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-month]");
          if (li) {
            currentMonth = parseInt(li.dataset.month);
            selectedMonthElement.textContent = li.textContent.trim();
            monthPickerModal.classList.add("hidden");
            renderCalendar(currentYear, currentMonth);
          }
        });

        yearListModal.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-year]");
          if (li) {
            currentYear = parseInt(li.dataset.year);
            selectedYearElement.textContent = li.textContent.trim();
            yearPickerModal.classList.add("hidden");
            renderCalendar(currentYear, currentMonth);
          }
        });

        function renderCalendar(year, month) {
          calendarElement.innerHTML = "";
          calendarTitle.textContent = `${getMonthName(month)} ${year}`;

          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const firstDay = new Date(year, month, 1).getDay();

          fillWeekdayNames();

          // No empty cells - cleaner grid that starts on correct day
          for (let day = 1; day <= daysInMonth; day++) {
            const cell = createCalendarCell(year, month, day);
            // Add margin for first day offset
            if (day === 1) {
              cell.style.gridColumnStart = firstDay + 1;
            }
            calendarElement.appendChild(cell);
          }

          updateDropdownHighlighting();
        }

        function fillWeekdayNames() {
          const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
          weekdayNamesElement.innerHTML = days.map((d) => `<div class="weekday-name">${d}</div>`).join("");
        }

        function createCalendarCell(year, month, day) {
          const cell = document.createElement("div");
          const isToday = year === today.getFullYear() && month === today.getMonth() && day === today.getDate();
          cell.className = `calendar-cell ${isToday ? "today" : ""}`;

          const date = new Date(year, month, day);
          const myanmarDate = new Mycal(`${month + 1}/${day}/${year}`);

          cell.innerHTML = `
          <div class="day-number">${day}</div>
          <div class="myanmar-date">
            <div>${myanmarDate.month.my} ${myanmarDate.day.mp.my}</div>
            <div>${myanmarDate.day.fd.my}</div>
          </div>
        `;

          cell.addEventListener("click", () => showModal(myanmarDate, date.toDateString()));
          return cell;
        }

        function showModal(myanmarDate, dateString) {
          modalDate.textContent = dateString;
          const dateObj = new Date(dateString);

          const cz = myanmarDate.chineseZodiac;
          const czText = cz?.my || cz?.mm || cz?.signInBurmese || cz?.en || "";
          const wz = Mycal.zodiac(dateObj.getDate(), dateObj.getMonth() + 1);
          const wzText = wz?.my || wz?.mm || wz?.sign_mm || wz?.en || "";

          // Show only top 4 most important details
          modalMyanmarDate.innerHTML = `
          <p class="modal-detail">${myanmarDate.month.my} ${myanmarDate.day.mp.my} ${myanmarDate.day.fd.my}</p>
          <p class="modal-detail">${myanmarDate.year.my}</p>
          <p class="modal-detail">${myanmarDate.weekday.my}</p>
          <p class="modal-detail">${czText} · ${wzText}</p>
        `;

          myModal.classList.remove("hidden");
        }

        function getMonthName(m) {
          return ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][m];
        }

        function updateDropdownHighlighting() {
          monthList.querySelectorAll("li").forEach((opt) => {
            opt.classList.toggle("selected", parseInt(opt.dataset.month) === currentMonth);
          });
          yearList.querySelectorAll("li").forEach((opt) => {
            opt.classList.toggle("selected", parseInt(opt.dataset.year) === currentYear);
          });
        }

        prevMonthButton.addEventListener("click", () => {
          currentMonth--;
          if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
            if (currentYear < 1885) {
              currentYear = 1885;
              currentMonth = 0;
            }
          }
          selectedMonthElement.textContent = getMonthName(currentMonth);
          selectedYearElement.textContent = currentYear;
          renderCalendar(currentYear, currentMonth);
        });

        nextMonthButton.addEventListener("click", () => {
          currentMonth++;
          if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
            if (currentYear > today.getFullYear() + 100) {
              currentYear = today.getFullYear() + 100;
              currentMonth = 11;
            }
          }
          selectedMonthElement.textContent = getMonthName(currentMonth);
          selectedYearElement.textContent = currentYear;
          renderCalendar(currentYear, currentMonth);
        });

        myModal.addEventListener("click", (e) => {
          if (e.target === myModal) myModal.classList.add("hidden");
        });

        // Close button handlers
        document.querySelectorAll(".modal-close").forEach((btn) => {
          btn.addEventListener("click", () => {
            btn.closest(".modal-overlay").classList.add("hidden");
          });
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            document.querySelectorAll(".modal-overlay").forEach((m) => m.classList.add("hidden"));
          }
        });

        // Hide loading screen
        const loadingOverlay = document.getElementById("loadingOverlay");
        setTimeout(() => {
          document.body.classList.remove("loading");
          document.body.classList.add("loaded");
          loadingOverlay.classList.add("hidden");
          setTimeout(() => loadingOverlay.remove(), 400);
        }, 600);

        renderCalendar(currentYear, currentMonth);

        function showToast(msg) {
          const toast = document.getElementById("toast");
          toast.textContent = msg;
          toast.classList.add("visible");
          setTimeout(() => toast.classList.remove("visible"), 2500);
        }

        // Jump to date
        document.getElementById("jumpToDate").addEventListener("click", () => {
          document.getElementById("jumpToDateModal").classList.remove("hidden");
        });

        document.getElementById("confirmJumpDate").addEventListener("click", () => {
          const input = document.getElementById("jumpDateInput");
          const date = new Date(input.value);
          if (!isNaN(date.getTime())) {
            currentYear = date.getFullYear();
            currentMonth = date.getMonth();
            selectedYearElement.textContent = currentYear;
            selectedMonthElement.textContent = getMonthName(currentMonth);
            renderCalendar(currentYear, currentMonth);
            document.getElementById("jumpToDateModal").classList.add("hidden");
            showToast(getMonthName(currentMonth) + " " + currentYear);
          }
        });

        document.getElementById("jumpDateInput").value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

        // Share
        document.getElementById("shareDate").addEventListener("click", () => {
          const url = `${window.location.origin}?year=${currentYear}&month=${currentMonth + 1}`;
          document.getElementById("shareLink").value = url;
          document.getElementById("shareModal").classList.remove("hidden");
        });

        document.getElementById("copyLink").addEventListener("click", async () => {
          const input = document.getElementById("shareLink");
          try {
            await navigator.clipboard.writeText(input.value);
            showToast("Copied");
          } catch {
            input.select();
            document.execCommand("copy");
            showToast("Copied");
          }
        });

        document.getElementById("shareNative").addEventListener("click", async () => {
          if (navigator.share) {
            try {
              await navigator.share({ title: "Myanmar Calendar", url: document.getElementById("shareLink").value });
            } catch {}
          }
        });

        shareModal.addEventListener("click", (e) => {
          if (e.target === shareModal) shareModal.classList.add("hidden");
        });

        // Export month calendar
        function exportMonthImage() {
          showToast("Generating...");

          const canvas = document.createElement("canvas");
          canvas.width = 1200;
          canvas.height = 1200;
          const ctx = canvas.getContext("2d");

          // Background with subtle gradient
          const gradient = ctx.createLinearGradient(0, 0, 0, 1200);
          gradient.addColorStop(0, "#ffffff");
          gradient.addColorStop(1, "#fafafa");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, 1200, 1200);

          // Elegant border
          ctx.strokeStyle = "#e5e5ea";
          ctx.lineWidth = 2;
          ctx.strokeRect(60, 60, 1080, 1080);

          // Title
          ctx.fillStyle = "#1d1d1f";
          ctx.font = "600 56px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(calendarTitle.textContent, 600, 140);

          // Weekday names - more subtle
          ctx.font = "500 22px -apple-system, sans-serif";
          ctx.fillStyle = "rgba(134, 134, 139, 0.7)";
          const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
          let x = 150;
          days.forEach((d) => {
            ctx.fillText(d, x, 220);
            x += 158;
          });

          // Calendar days
          ctx.fillStyle = "#1d1d1f";
          const cells = calendarElement.querySelectorAll(".calendar-cell");
          let row = 0;
          let col = 0;
          cells.forEach((cell) => {
            const dayNum = cell.querySelector(".day-number").textContent;
            const x = 150 + col * 158;
            const y = 300 + row * 85;

            // Highlight today
            if (cell.classList.contains("today")) {
              ctx.beginPath();
              ctx.arc(x, y - 15, 32, 0, Math.PI * 2);
              ctx.strokeStyle = "rgba(0, 122, 255, 0.25)";
              ctx.lineWidth = 3;
              ctx.stroke();
              ctx.fillStyle = "#007aff";
            } else {
              ctx.fillStyle = "#1d1d1f";
            }

            ctx.font = "600 40px -apple-system, sans-serif";
            ctx.fillText(dayNum, x, y);

            // Myanmar date
            const myanmarText = cell.querySelector(".myanmar-date");
            if (myanmarText) {
              ctx.font = "16px -apple-system, sans-serif";
              ctx.fillStyle = "rgba(134, 134, 139, 0.7)";
              const lines = myanmarText.querySelectorAll("div");
              lines.forEach((line, i) => {
                ctx.fillText(line.textContent, x, y + 28 + i * 20);
              });
            }

            col++;
            if (col > 6) {
              col = 0;
              row++;
            }
          });

          // Footer
          ctx.font = "italic 20px -apple-system, sans-serif";
          ctx.fillStyle = "rgba(134, 134, 139, 0.5)";
          ctx.fillText("Myanmar Calendar", 600, 1140);

          const link = document.createElement("a");
          link.download = `myanmar-calendar-${new Date().toISOString().slice(0, 10)}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();

          showToast("Exported");
        }

        // Export date detail
        function exportDateImage() {
          showToast("Generating...");

          const canvas = document.createElement("canvas");
          canvas.width = 1080;
          canvas.height = 1080;
          const ctx = canvas.getContext("2d");

          // Background with subtle gradient
          const gradient = ctx.createLinearGradient(0, 0, 0, 1080);
          gradient.addColorStop(0, "#ffffff");
          gradient.addColorStop(1, "#fafafa");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, 1080, 1080);

          // Elegant border
          ctx.strokeStyle = "#e5e5ea";
          ctx.lineWidth = 2;
          ctx.strokeRect(50, 50, 980, 980);

          // Date title
          ctx.fillStyle = "#1d1d1f";
          ctx.font = "600 48px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(modalDate.textContent, 540, 150);

          // Myanmar date details
          ctx.font = "500 26px -apple-system, sans-serif";
          let y = 260;
          const details = modalMyanmarDate.querySelectorAll(".modal-detail");
          const spacing = 95;

          details.forEach((detail, index) => {
            ctx.fillStyle = "#1d1d1f";
            ctx.fillText(detail.textContent, 540, y);
            y += spacing;
          });

          // Divider
          ctx.strokeStyle = "#e5e5ea";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(200, y + 30);
          ctx.lineTo(880, y + 30);
          ctx.stroke();

          // Footer
          ctx.font = "italic 20px -apple-system, sans-serif";
          ctx.fillStyle = "rgba(134, 134, 139, 0.5)";
          ctx.fillText("Myanmar Calendar", 540, 1000);

          const link = document.createElement("a");
          link.download = `myanmar-calendar-date-${new Date().toISOString().slice(0, 10)}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();

          showToast("Exported");
        }

        document.getElementById("exportMonth").addEventListener("click", exportMonthImage);
        document.getElementById("exportDateImage").addEventListener("click", exportDateImage);

        // URL params
        const params = new URLSearchParams(window.location.search);
        const urlYear = params.get("year");
        const urlMonth = params.get("month");
        if (urlYear && urlMonth) {
          const y = parseInt(urlYear);
          const m = parseInt(urlMonth) - 1;
          if (y >= 1885 && y <= today.getFullYear() + 100 && m >= 0 && m <= 11) {
            currentYear = y;
            currentMonth = m;
            selectedYearElement.textContent = currentYear;
            selectedMonthElement.textContent = getMonthName(currentMonth);
            renderCalendar(currentYear, currentMonth);
          }
        }

        // Keyboard nav
        document.addEventListener("keydown", (e) => {
          if (e.target.tagName === "INPUT") return;
          if (e.key === "ArrowLeft") prevMonthButton.click();
          else if (e.key === "ArrowRight") nextMonthButton.click();
          else if (e.key === "Home") {
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            selectedYearElement.textContent = currentYear;
            selectedMonthElement.textContent = getMonthName(currentMonth);
            renderCalendar(currentYear, currentMonth);
          } else if (e.key === "/") {
            // Quick search shortcut
            const prompt = window.prompt("Search Myanmar dates:");
            if (prompt) {
              const query = prompt.toLowerCase();
              for (let m = 0; m < 12; m++) {
                const days = new Date(currentYear, m + 1, 0).getDate();
                for (let d = 1; d <= days; d++) {
                  const myanmarDate = new Mycal(`${m + 1}/${d}/${currentYear}`);
                  const text = `${myanmarDate.month.my} ${myanmarDate.day.mp.my} ${myanmarDate.day.fd.my} ${getMonthName(m)}`.toLowerCase();
                  if (text.includes(query)) {
                    currentMonth = m;
                    selectedMonthElement.textContent = getMonthName(currentMonth);
                    renderCalendar(currentYear, currentMonth);
                    showToast(getMonthName(m) + " " + d);
                    return;
                  }
                }
              }
              showToast("Not found");
            }
          }
        });

        // Swipe
        let touchStartX = 0;
        document.querySelector("main").addEventListener("touchstart", (e) => {
          touchStartX = e.touches[0].clientX;
        });

        document.querySelector("main").addEventListener("touchend", (e) => {
          const diff = touchStartX - e.changedTouches[0].clientX;
          if (Math.abs(diff) > 50) {
            if (diff > 0) nextMonthButton.click();
            else prevMonthButton.click();
          }
        });

        // PWA
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("/service-worker.js").catch(() => {});
        }
      });
    </script>
  </body>
</html>
